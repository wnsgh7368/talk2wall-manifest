adminPassword: "1234"

persistence:
  enabled: false

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - grafana.talk2wall.com
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.talk2wall.com

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
        access: proxy
        isDefault: true
      
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    k8s-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    k8s-pods:
      gnetId: 15760
      revision: 36
      datasource: Prometheus