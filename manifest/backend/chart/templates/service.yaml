apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-be-service
spec:
  selector:
    app: {{ .Values.matchLabels.app }}
    component: {{ .Values.matchLabels.component }}
    env: {{ .Values.matchLabels.env }}

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.ports.name }}
  type: ClusterIP