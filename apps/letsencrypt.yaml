apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsencrypt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wnsgh7368/talk2wall-manifest
    targetRevision: main
    path: manifest/letsencrypt
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true